name: distributed-digitaltwin-robot

services:
  nats:
    image: nats:2.15-alpine
    command: ["--js"]
    ports:
      - "4222:4222"

  simulator:
    build:
      context: ./backend
      dockerfile: Containerfile
      target: simulator
    environment:
      NATS_URL: nats://nats:4222
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    depends_on:
      - nats

  digitaltwin:
    build:
      context: ./backend
      dockerfile: Containerfile
      target: digitaltwin
    environment:
      NATS_URL: nats://nats:4222
      ENGINE_WORKER_COUNT: 64
      ENGINE_BUFFER_SIZE: 10000
      TIMESCALEDB_FLUSH_BATCH_SIZE: 5000 # Flush to TimescaleDB every 5000 messages or 5s
      TIMESCALEDB_FLUSH_INTERVAL: "5s" # Flush to TimescaleDB every 5 seconds
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: "32M"
    depends_on:
      - nats
